name: Release

# Builds and publishes:
#   - macOS .dmg (built on macos-latest, includes the bundled CPU sidecar)
#   - Windows .msi (built on windows-latest, includes the bundled CPU sidecar)
#   - PodCodex-macos-arm64.dmg + PodCodex-windows-x64.msi — version-less
#     aliases so README can link to /releases/latest/download/<alias>
#   - server-core + torch-runtime-<tag> + cuda-libs-<tag> .tar.xz archives and cuda-libs.json (Windows GPU
#     archives for the in-app runtime CUDA install)
#   - the same aliases + GPU archives mirrored onto the rolling "beta"
#     release when this build is the newest (see the beta-channel job)
#   - latest.json (Tauri updater manifest — only when TAURI_SIGNING_PRIVATE_KEY
#     is configured; see deploy/BUILD.md for keypair setup)
#
# Linux is intentionally not built (see deploy/BUILD.md). Linux users
# build from source via `make dev`.
#
# Each platform job builds + uploads its own artifacts to the same release
# tag (tauri-action handles the deduplication). Windows additionally
# uploads the GPU archives via softprops/action-gh-release.
#
# Tag name controls release flow:
#   vX.Y.Z          → stable, becomes "latest"
#   vX.Y.Z-beta.N   → prerelease (any hyphen suffix), skipped by "latest"
#   workflow_dispatch → draft, hidden until manually published
# See CLAUDE.md "Release tags" for details.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to build (defaults to current ref)"
        required: false

jobs:
  # ── macOS DMG ───────────────────────────────────────────────────────────
  build-macos:
    name: macOS DMG
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Setup Python deps
        run: make setup-python setup-pyinstaller

      - name: Setup frontend
        run: make setup-frontend

      - name: Build CPU sidecar
        run: .venv/bin/python packaging/build_server.py --clean

      # Same guard as the Windows job: catch a missing/stale sidecar tree
      # here rather than shipping a DMG whose backend never starts.
      - name: Verify bundled sidecars are present
        run: |
          set -euo pipefail
          exe=src-tauri/binaries/server/podcodex-server
          [ -e "$exe" ] || { echo "Missing: $exe" >&2; exit 1; }
          test -x "$exe"
          # Size floor, not mere existence: scripts/setup_dev_sidecar.py
          # leaves an executable 3-line shell stub at the same path, and a
          # stub tree passes every presence check while producing a bundle
          # whose backend never starts.
          size=$(stat -f%z "$exe")
          [ "$size" -ge 10000000 ] || {
            echo "$exe is $size bytes — dev placeholder, not a real build" >&2
            exit 1
          }
          count=$(find src-tauri/binaries/server/_internal -type f | wc -l)
          [ "$count" -ge 1000 ] || {
            echo "_internal holds $count files — incomplete PyInstaller tree" >&2
            exit 1
          }
          echo "✓ $exe ($size bytes), _internal ($count files)"

      - uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — uploads latest.json when set, silently skips
          # when not. Generate locally with `tauri signer generate -w` and
          # add the keypair to repo secrets (see deploy/BUILD.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "PodCodex ${{ github.ref_name }}"
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true

      # Upload version-less alias so README can link to a stable URL:
      #   /releases/latest/download/PodCodex-macos-arm64.dmg
      # `gh release upload file#label` sets the display label, not the
      # asset filename — must copy to the target name first.
      # Replace versioned DMG with stable-name alias. tauri-action already
      # uploaded PodCodex_X.Y.Z_aarch64.dmg; we delete it and re-upload the
      # same bytes under the version-less name. .app.tar.gz (updater) keeps
      # its versioned name — latest.json points there, not at the .dmg.
      - name: Mirror DMG with stable name (replace versioned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(ls src-tauri/target/release/bundle/dmg/PodCodex_*_aarch64.dmg | head -1)
          DMG_NAME=$(basename "${DMG}")
          mv "${DMG}" PodCodex-macos-arm64.dmg
          gh release upload "${{ github.ref_name }}" PodCodex-macos-arm64.dmg --clobber
          gh release delete-asset "${{ github.ref_name }}" "${DMG_NAME}" --yes || true

  # ── Windows MSI + GPU archives ──────────────────────────────────────────
  build-windows:
    name: Windows MSI + GPU
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Setup Python deps
        run: |
          uv sync --extra desktop --extra pipeline --extra rag --extra youtube --extra mcp
          uv pip install pyinstaller --python .venv/Scripts/python.exe

      - name: Setup frontend
        run: |
          cd frontend
          npm install

      # CPU build first — produces src-tauri/binaries/podcodex-server-<triple>.exe
      # consumed by tauri-action below. --clean wipes packaging/build_work so
      # PyInstaller can't reuse anything from a prior step.
      - name: Build CPU sidecar
        run: .venv/Scripts/python.exe packaging/build_server.py --clean

      # The server sidecar is a --onedir tree bundled as a Tauri resource,
      # not an externalBin file, so check the exe inside it.
      - name: Verify bundled sidecars are present
        run: |
          $exe = "src-tauri\binaries\server\podcodex-server.exe"
          if (-not (Test-Path $exe)) { Write-Error "Missing: $exe"; exit 1 }
          # Size floor, not mere existence: scripts/setup_dev_sidecar.py
          # leaves a 66-byte stub at the same path, and a stub tree passes
          # every presence check while producing a bundle whose backend
          # never starts.
          $size = (Get-Item $exe).Length
          if ($size -lt 10MB) {
            Write-Error "$exe is $size bytes — dev placeholder, not a real build"
            exit 1
          }
          $count = (Get-ChildItem "src-tauri\binaries\server\_internal" -Recurse -File).Count
          if ($count -lt 1000) {
            Write-Error "_internal holds $count files — incomplete PyInstaller tree"
            exit 1
          }
          Write-Host "✓ $exe ($size bytes), _internal ($count files)"

      # GPU build needs CUDA-flavored torch in the venv so PyInstaller can
      # bundle the NVIDIA runtime libs. Without this, package_gpu.py would
      # find no nvidia/* files and fail.
      - name: Install CUDA-flavored torch for GPU build
        run: |
          uv pip install torch torchvision torchaudio `
            --index-url https://download.pytorch.org/whl/cu128 `
            --reinstall --no-deps `
            --python .venv/Scripts/python.exe

      - name: Verify CUDA torch is active
        run: .venv/Scripts/python.exe -c "import torch; print('cuda:', torch.version.cuda); assert torch.version.cuda, 'CUDA torch not installed'"

      # GPU build: separate --onedir output. --no-torch-swap because we
      # explicitly want the cu128 torch we just installed in the bundle.
      - name: Build GPU sidecar (--onedir, includes CUDA libs)
        run: .venv/Scripts/python.exe packaging/build_server.py --gpu --clean --no-torch-swap

      - name: Package GPU archives + manifest
        run: .venv/Scripts/python.exe packaging/package_gpu.py

      - name: Upload GPU archives to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            packaging/release-assets/server-core.tar.xz
            packaging/release-assets/server-core.tar.xz.sha256
            packaging/release-assets/torch-runtime-*.tar.xz
            packaging/release-assets/torch-runtime-*.tar.xz.sha256
            packaging/release-assets/cuda-libs-*.tar.xz
            packaging/release-assets/cuda-libs-*.tar.xz.sha256
            packaging/release-assets/cuda-libs.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The MSI goes up after the GPU archives, so a release's installer is
      # never downloadable before its own GPU build: during that window the
      # app's tagged manifest lookup 404s and would fall back to the beta
      # channel, which can hold another build of the same version. The GPU
      # build writes to packaging/dist; the CPU sidecar the MSI bundles stays
      # in src-tauri/binaries/server.
      - uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "PodCodex ${{ github.ref_name }}"
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true

      # Upload version-less alias so README can link to a stable URL:
      #   /releases/latest/download/PodCodex-windows-x64.msi
      # `gh release upload file#label` sets the display label, not the
      # asset filename — must copy to the target name first.
      # Replace versioned MSI with stable-name alias. tauri-action already
      # uploaded PodCodex_X.Y.Z_x64_en-US.msi; we delete it and re-upload
      # the same bytes under the version-less name. .msi.zip (updater)
      # keeps its versioned name — latest.json points there, not at .msi.
      - name: Mirror MSI with stable name (replace versioned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msi = Get-ChildItem src-tauri\target\release\bundle\msi\PodCodex_*_x64_en-US.msi | Select-Object -First 1
          Move-Item $msi.FullName PodCodex-windows-x64.msi
          gh release upload "${{ github.ref_name }}" PodCodex-windows-x64.msi --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Error "gh release upload failed for PodCodex-windows-x64.msi; the README's stable download link would 404"
            exit 1
          }
          # Only the delete of the versioned original is best-effort: the alias
          # above is what the README resolves to, so its upload must fail loudly.
          gh release delete-asset "${{ github.ref_name }}" $msi.Name --yes 2>$null
          exit 0

  # ── Rolling "beta" channel ──────────────────────────────────────────────
  # The README's beta links point at /releases/download/beta/<alias>, the
  # newest build. Every tagged release, stable included, refreshes the
  # channel when it is newer than what the channel holds, so the beta link
  # never serves a build older than the stable one. The app's GPU download
  # falls back to this channel's manifest (gpu_backend._fetch_manifest),
  # which is how a prerelease, whose tag is not derivable from its version,
  # finds its GPU backend. Pushing the "beta" tag does not retrigger this
  # workflow: it only matches v*.
  beta-channel:
    name: Beta channel
    needs: [build-macos, build-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Two tags pushed close together would both read the same channel build
    # and race their uploads; queue them instead (each compares again).
    concurrency:
      group: beta-channel
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      CHANNEL: beta
    steps:
      - name: Is this build newer than the channel's?
        id: check
        run: |
          set -euo pipefail
          # tr: notes edited in the web UI come back with CRLF line ends.
          current=$(gh release view "$CHANNEL" --json body -q .body 2>/dev/null \
            | tr -d '\r' | sed -n 's/^Build: \(v[^ ]*\).*/\1/p' | head -1 || true)
          newer=$(python3 - "$TAG" "$current" <<'PY'
          import re, sys

          def key(tag):
              # Any hyphen suffix is a prerelease (CLAUDE.md "Release tags"):
              # v1.2.3-beta, -beta.2, -rc1, -test all parse.
              m = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)(?:-([A-Za-z]*)\.?(\d*).*)?", tag)
              if not m:
                  return None
              major, minor, patch, stage, n = m.groups()
              # A stable X.Y.Z outranks every X.Y.Z prerelease; an unknown
              # suffix ranks below alpha.
              if stage is None:
                  rank = 4
              else:
                  rank = {"alpha": 1, "beta": 2, "rc": 3}.get(stage.lower(), 0)
              return (int(major), int(minor), int(patch), rank, int(n or 0))

          new, cur = key(sys.argv[1]), key(sys.argv[2])
          if new is None:
              # The release itself is published; only the channel skips it.
              print(f"Tag {sys.argv[1]!r} is not vX.Y.Z[-suffix], channel left as is", file=sys.stderr)
              print("false")
          else:
              print("true" if cur is None or new > cur else "false")
          PY
          )
          echo "Channel holds '${current:-nothing}', this build is $TAG: update=$newer"
          echo "update=$newer" >> "$GITHUB_OUTPUT"

      - name: Mirror this release onto the channel
        if: steps.check.outputs.update == 'true'
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$TAG" --dir assets \
            -p 'PodCodex-macos-arm64.dmg' -p 'PodCodex-windows-x64.msi' \
            -p 'server-core.tar.*' -p 'torch-runtime-*' -p 'cuda-libs*'
          ls -la assets
          for f in PodCodex-macos-arm64.dmg PodCodex-windows-x64.msi cuda-libs.json server-core.tar.xz; do
            [ -e "assets/$f" ] || { echo "Missing from $TAG: $f" >&2; exit 1; }
          done

          notes="Build: $TAG
          The newest PodCodex build, beta or stable. For the newest stable release only, use https://github.com/$GH_REPO/releases/latest"
          if gh release view "$CHANNEL" >/dev/null 2>&1; then
            # Point the tag at this build so the release's source matches.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$CHANNEL" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            # Notes name no build until the uploads are done (see below).
            gh release create "$CHANNEL" --prerelease --target "$GITHUB_SHA" \
              --title "PodCodex beta (newest build)" --notes "Build: pending"
          fi
          # Archives first and the GPU manifest after them, so the manifest
          # never names an archive that isn't up yet. server-core.tar.xz keeps
          # its name across builds, so a GPU install started during this
          # upload can fail its digest check once; retrying succeeds.
          find assets -type f ! -name cuda-libs.json -print0 \
            | xargs -0 gh release upload "$CHANNEL" --clobber
          gh release upload "$CHANNEL" assets/cuda-libs.json --clobber
          # The notes name the build last: a run that dies before this point
          # leaves the old name, so a rerun compares and uploads again.
          gh release edit "$CHANNEL" --prerelease --notes "$notes"

          # Drop files the previous build had and this one does not (an
          # archive renamed by a version bump), so the channel holds one build.
          keep=$(ls assets)
          gh release view "$CHANNEL" --json assets -q '.assets[].name' | while read -r name; do
            grep -qxF "$name" <<< "$keep" || gh release delete-asset "$CHANNEL" "$name" --yes
          done
