services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    volumes:
      # Index directory — same path as the desktop app and the uv install use
      # by default, so a single location works for everyone. Override by
      # setting PODCODEX_INDEX_HOST in .env if your index lives elsewhere.
      - ${PODCODEX_INDEX_HOST:-~/.local/share/podcodex/index}:/root/.local/share/podcodex/index
      # Data dir, for the machine identity that marks which host owns the
      # index. Without it the id is regenerated on every rebuild and an index
      # claimed here would silently revert to being someone else's replica.
      # The index bind above is nested inside this volume and still wins for
      # its own subtree (Docker resolves the longer path first).
      # It also carries the per-guild bot state and the HF model cache
      # (<data_dir>/models/huggingface/), so BGE-M3 survives rebuilds. Docker
      # seeds a freshly created volume from the image, which is where the
      # Dockerfile's pre-download lands.
      - podcodex_data:/root/.local/share/podcodex
    deploy:
      resources:
        limits:
          memory: 3G
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  podcodex_data:
